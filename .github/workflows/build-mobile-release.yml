name: Build Mobile Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-release.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Regenerate Android platform files
        run: flutter create --platforms=android --org com.julqarn --project-name ip_intelligence .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Prepare release asset
        run: cp build/app/outputs/flutter-apk/app-release.apk ip-intelligence-v1.0.1.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v1.0.1
          name: IP Intelligence Mobile v1.0.1
          body: |
            IP Intelligence mobile app for Android.

            Download ip-intelligence-v1.0.1.apk and install it directly on your Android phone. Android may ask you to allow installation from your browser or file manager.
          files: mobile/ip-intelligence-v1.0.1.apk
